<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>FACEIT HUD</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1920px;
  height: 1080px;
  background: transparent;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #fff;
  overflow: hidden;
}

#hud {
  position: absolute;
  top: 30px;
  left: 30px;
  background: linear-gradient(145deg, rgba(10, 13, 18, 0.95) 0%, rgba(20, 22, 31, 0.95) 100%);
  border-radius: 12px;
  border: 1px solid rgba(255, 85, 0, 0.3);
  box-shadow: 
    0 12px 48px rgba(0, 0, 0, 0.9),
    0 0 0 1px rgba(255, 85, 0, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  overflow: hidden;
  width: 320px;
  backdrop-filter: blur(10px);
}

.accent-bar {
  height: 3px;
  background: linear-gradient(90deg, #FF5500 0%, #FF8833 50%, #FF5500 100%);
  background-size: 200% 100%;
  animation: shimmer 3s ease-in-out infinite;
  box-shadow: 
    0 0 12px rgba(255, 85, 0, 0.7),
    0 0 24px rgba(255, 85, 0, 0.4);
}

@keyframes shimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.hud-header {
  padding: 16px 22px;
  background: linear-gradient(135deg, rgba(255, 85, 0, 0.1) 0%, rgba(255, 85, 0, 0.03) 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
  display: flex;
  align-items: center;
  gap: 12px;
}

.faceit-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, #FF5500 0%, #FF7733 100%);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 15px;
  letter-spacing: -0.5px;
  box-shadow: 
    0 4px 12px rgba(255, 85, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.3),
    inset 0 -2px 0 rgba(0, 0, 0, 0.2);
  position: relative;
  overflow: hidden;
}

.faceit-icon::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.15), transparent);
  animation: shine 3s ease-in-out infinite;
}

@keyframes shine {
  0%, 100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
  50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

.header-text {
  flex: 1;
}

#title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #fff;
  line-height: 1;
}

.subtitle {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.5);
  font-weight: 500;
  margin-top: 4px;
  letter-spacing: 0.5px;
}

.hud-body {
  padding: 20px 22px 22px;
}

/* ELO Display */
.elo-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px;
  background: linear-gradient(135deg, rgba(255, 85, 0, 0.08) 0%, rgba(255, 85, 0, 0.03) 100%);
  border-radius: 10px;
  border: 1px solid rgba(255, 85, 0, 0.18);
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.elo-section::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at 30% 50%, rgba(255, 85, 0, 0.12) 0%, transparent 70%);
  opacity: 0.6;
}

.elo-info {
  display: flex;
  align-items: baseline;
  gap: 10px;
  position: relative;
  z-index: 1;
}

.elo-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: rgba(255, 255, 255, 0.55);
}

.elo-value {
  font-size: 36px;
  font-weight: 900;
  color: #fff;
  line-height: 1;
  letter-spacing: -1.5px;
  text-shadow: 
    0 0 20px rgba(255, 85, 0, 0.5),
    0 2px 4px rgba(0, 0, 0, 0.6);
  transition: all 0.3s ease;
}

.level-badge {
  background: linear-gradient(135deg, rgba(255, 85, 0, 0.28) 0%, rgba(255, 85, 0, 0.14) 100%);
  border: 2px solid rgba(255, 85, 0, 0.45);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 56px;
  position: relative;
  z-index: 1;
  box-shadow: 
    0 4px 12px rgba(255, 85, 0, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

.level-label {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: rgba(255, 255, 255, 0.6);
}

.level-value {
  font-size: 20px;
  font-weight: 900;
  color: #FF5500;
  line-height: 1;
  text-shadow: 0 0 12px rgba(255, 85, 0, 0.6);
}

/* ELO Diff */
.elo-diff {
  text-align: center;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 16px;
  min-height: 20px;
}

/* Win/Loss Section */
.winloss-section {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.02) 100%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  padding: 16px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
}

.winloss-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: rgba(255, 255, 255, 0.5);
  margin-bottom: 10px;
  text-align: center;
}

.winloss-display {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 12px;
}

.win-stat, .loss-stat {
  display: flex;
  align-items: baseline;
  gap: 5px;
  transition: all 0.3s ease;
}

.stat-number {
  font-size: 26px;
  font-weight: 800;
}

.stat-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  opacity: 0.7;
}

.separator {
  color: rgba(255, 255, 255, 0.3);
  font-size: 20px;
  font-weight: 300;
}

/* Winrate Bar */
.winrate-bar {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  margin-top: 10px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
}

.winrate-fill {
  height: 100%;
  background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 4px;
  box-shadow: 0 0 10px rgba(74, 222, 128, 0.7);
  position: relative;
}

.winrate-fill::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
  animation: progress-shine 2s ease-in-out infinite;
}

@keyframes progress-shine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.winrate-percent {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: #4ade80;
  margin-top: 8px;
  text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
}

.green { 
  color: #4ade80;
  text-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
}

.red { 
  color: #f87171;
  text-shadow: 0 0 12px rgba(248, 113, 113, 0.6);
}

/* Glow */
#glow {
  position: absolute;
  right: 40px;
  bottom: 40px;
  width: 440px;
  height: 440px;
  border-radius: 26px;
  background: radial-gradient(circle, rgba(255, 85, 0, 0.45) 0%, rgba(168, 85, 247, 0.35) 50%, rgba(0, 240, 255, 0.25) 100%);
  filter: blur(45px);
  opacity: 0;
  animation: glowPulse 5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes glowPulse {
  0%, 100% { 
    opacity: 0.22;
    transform: scale(0.96) rotate(0deg);
  }
  50% { 
    opacity: 0.45;
    transform: scale(1.06) rotate(10deg);
  }
}

/* Animációk */
.elo-pulse {
  animation: eloPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes eloPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.win-bounce {
  animation: winBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes winBounce {
  0%, 100% { transform: scale(1); }
  50% { 
    transform: scale(1.35);
    filter: drop-shadow(0 0 20px #4ade80);
  }
}

.loss-bounce {
  animation: lossBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes lossBounce {
  0%, 100% { transform: scale(1); }
  50% { 
    transform: scale(1.35);
    filter: drop-shadow(0 0 20px #f87171);
  }
}

.elo-gain {
  animation: eloGain 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes eloGain {
  0% { transform: translateY(20px) scale(0.8); opacity: 0; }
  50% { transform: translateY(-5px) scale(1.1); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

.elo-loss {
  animation: eloLoss 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes eloLoss {
  0% { transform: translateY(-20px) scale(0.8); opacity: 0; }
  50% { transform: translateY(5px) scale(1.1); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

#screenFlash {
  position: fixed;
  top: 0;
  left: 0;
  width: 1920px;
  height: 1080px;
  pointer-events: none;
  opacity: 0;
  z-index: 9999;
}

.flash-win {
  animation: flashWin 0.6s ease-out;
}

@keyframes flashWin {
  0% { background: rgba(74, 222, 128, 0.35); opacity: 1; }
  100% { background: rgba(74, 222, 128, 0); opacity: 0; }
}

.flash-loss {
  animation: flashLoss 0.6s ease-out;
}

@keyframes flashLoss {
  0% { background: rgba(248, 113, 113, 0.35); opacity: 1; }
  100% { background: rgba(248, 113, 113, 0); opacity: 0; }
}
</style>
</head>
<body>

<div id="hud">
  <div class="accent-bar"></div>
  
  <div class="hud-header">
    <div class="faceit-icon">F</div>
    <div class="header-text">
      <div id="title">FACEIT</div>
      <div class="subtitle">Counter-Strike 2</div>
    </div>
  </div>
  
  <div class="hud-body">
    <div class="elo-section">
      <div class="elo-info">
        <span class="elo-label">ELO</span>
        <span class="elo-value" id="elo">----</span>
      </div>
      <div class="level-badge">
        <span class="level-label">LVL</span>
        <span class="level-value" id="lvl">-</span>
      </div>
    </div>
    
    <div class="elo-diff" id="eloDiff"></div>
    
    <div class="winloss-section">
      <div class="winloss-label">Match Record</div>
      <div class="winloss-display">
        <div class="win-stat">
          <span class="stat-number green" id="wins">-</span>
          <span class="stat-label green">W</span>
        </div>
        <span class="separator">/</span>
        <div class="loss-stat">
          <span class="stat-number red" id="losses">-</span>
          <span class="stat-label red">L</span>
        </div>
      </div>
      <div class="winrate-bar">
        <div class="winrate-fill" id="winrateFill"></div>
      </div>
      <div class="winrate-percent" id="winratePercent">-%</div>
    </div>
  </div>
</div>

<div id="glow"></div>
<div id="screenFlash"></div>

<script>
const API_URL = "https://api.jakobkristensen.com/76561198252968768";

const elements = {
  lvl: document.getElementById("lvl"),
  elo: document.getElementById("elo"),
  wins: document.getElementById("wins"),
  losses: document.getElementById("losses"),
  eloDiff: document.getElementById("eloDiff"),
  winrateFill: document.getElementById("winrateFill"),
  winratePercent: document.getElementById("winratePercent"),
  screenFlash: document.getElementById("screenFlash")
};

let previousData = {
  elo: null,
  wins: null,
  losses: null
};

function triggerScreenFlash(isWin) {
  elements.screenFlash.className = isWin ? 'flash-win' : 'flash-loss';
  setTimeout(() => {
    elements.screenFlash.className = '';
  }, 600);
}

function animateEloChange(isGain) {
  elements.elo.classList.add(isGain ? 'elo-gain' : 'elo-loss');
  setTimeout(() => {
    elements.elo.classList.remove('elo-gain', 'elo-loss');
  }, 800);
}

function animateWinLoss(type) {
  const element = type === 'win' ? elements.wins.parentElement : elements.losses.parentElement;
  element.classList.add(type === 'win' ? 'win-bounce' : 'loss-bounce');
  setTimeout(() => {
    element.classList.remove('win-bounce', 'loss-bounce');
  }, 600);
}

async function updateFaceit() {
  try {
    const res = await fetch(API_URL);
    const d = await res.json();
    
    // Detektáljuk a változásokat
    const eloChanged = previousData.elo !== null && previousData.elo !== d.elo;
    const winChanged = previousData.wins !== null && previousData.wins !== d.results.wins;
    const lossChanged = previousData.losses !== null && previousData.losses !== d.results.losses;
    
    // ELO változás animáció
    if (eloChanged) {
      const isGain = d.elo > previousData.elo;
      animateEloChange(isGain);
      elements.elo.classList.add('elo-pulse');
      setTimeout(() => elements.elo.classList.remove('elo-pulse'), 600);
    }
    
    // Win változás
    if (winChanged && d.results.wins > previousData.wins) {
      triggerScreenFlash(true);
      animateWinLoss('win');
    }
    
    // Loss változás
    if (lossChanged && d.results.losses > previousData.losses) {
      triggerScreenFlash(false);
      animateWinLoss('loss');
    }
    
    // Adatok frissítése
    elements.lvl.textContent = d.lvl;
    elements.elo.textContent = d.elo;
    elements.wins.textContent = d.results.wins;
    elements.losses.textContent = d.results.losses;
    
    // Winrate számítás
    const totalGames = d.results.wins + d.results.losses;
    const winrate = totalGames > 0 ? (d.results.wins / totalGames * 100) : 0;
    elements.winrateFill.style.width = winrate + '%';
    elements.winratePercent.textContent = winrate.toFixed(0) + '%';
    
    // ELO különbség megjelenítés
    const diff = d.todayEloDiff;
    if (diff && diff.startsWith("+")) {
      elements.eloDiff.innerHTML = `<span class="green">▲ ${diff} today</span>`;
    } else if (diff && diff.startsWith("-")) {
      elements.eloDiff.innerHTML = `<span class="red">▼ ${diff} today</span>`;
    } else {
      elements.eloDiff.innerHTML = `<span style="color: rgba(255,255,255,0.3); font-size: 11px;">—</span>`;
    }
    
    // Előző adatok mentése
    previousData = {
      elo: d.elo,
      wins: d.results.wins,
      losses: d.results.losses
    };
    
  } catch (e) {
    console.error('FACEIT API Error:', e);
    elements.elo.textContent = "ERR";
    elements.eloDiff.innerHTML = `<span style="color: #f87171; font-size: 11px;">Connection failed</span>`;
  }
}

// Első betöltés
updateFaceit();

// Azonnali frissítés - 3 másodpercenként
setInterval(updateFaceit, 3000);
</script>

</body>
</html>
