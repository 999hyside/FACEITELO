<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FACEIT Overlay</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 1920px;
  height: 1080px;
  background: transparent !important;
  overflow: hidden;
}

body {
  font-family: 'Segoe UI', 'Arial', sans-serif;
  color: #fff;
}

#hud {
  position: absolute;
  top: 30px;
  left: 30px;
  background: linear-gradient(145deg, rgba(12, 15, 22, 0.88) 0%, rgba(18, 21, 29, 0.92) 100%);
  border-radius: 14px;
  border: 1px solid rgba(255, 85, 0, 0.35);
  box-shadow: 
    0 16px 56px rgba(0, 0, 0, 0.8),
    0 0 1px 1px rgba(255, 85, 0, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
  overflow: hidden;
  width: 330px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.accent-bar {
  height: 3px;
  background: linear-gradient(90deg, #FF5500 0%, #FF9944 50%, #FF5500 100%);
  background-size: 200% 100%;
  animation: shimmer 4s ease-in-out infinite;
  box-shadow: 0 0 16px rgba(255, 85, 0, 0.8);
}

@keyframes shimmer {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.hud-header {
  padding: 18px 24px;
  background: linear-gradient(135deg, rgba(255, 85, 0, 0.12) 0%, rgba(255, 85, 0, 0.04) 100%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  gap: 14px;
}

.faceit-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #FF5500 0%, #FF7733 100%);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 17px;
  box-shadow: 
    0 6px 16px rgba(255, 85, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
  position: relative;
  overflow: hidden;
}

.faceit-icon::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.2), transparent 70%);
  animation: iconShine 3s ease-in-out infinite;
}

@keyframes iconShine {
  0%, 100% { transform: translateX(-150%) rotate(45deg); }
  50% { transform: translateX(150%) rotate(45deg); }
}

.header-text {
  flex: 1;
}

#title {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 2.4px;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 2px 8px rgba(255, 85, 0, 0.4);
}

.subtitle {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.55);
  font-weight: 500;
  margin-top: 4px;
  letter-spacing: 0.8px;
}

.hud-body {
  padding: 22px 24px 24px;
}

.elo-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px;
  background: linear-gradient(135deg, rgba(255, 85, 0, 0.1) 0%, rgba(255, 85, 0, 0.04) 100%);
  border-radius: 12px;
  border: 1px solid rgba(255, 85, 0, 0.22);
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
}

.elo-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 25% 50%, rgba(255, 85, 0, 0.15) 0%, transparent 65%);
}

.elo-info {
  display: flex;
  align-items: baseline;
  gap: 12px;
  position: relative;
  z-index: 1;
}

.elo-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: rgba(255, 255, 255, 0.6);
}

.elo-value {
  font-size: 40px;
  font-weight: 900;
  color: #fff;
  line-height: 1;
  letter-spacing: -2px;
  text-shadow: 
    0 0 24px rgba(255, 85, 0, 0.6),
    0 3px 6px rgba(0, 0, 0, 0.7);
}

.level-badge {
  background: linear-gradient(135deg, rgba(255, 85, 0, 0.32) 0%, rgba(255, 85, 0, 0.18) 100%);
  border: 2px solid rgba(255, 85, 0, 0.5);
  border-radius: 10px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 60px;
  position: relative;
  z-index: 1;
  box-shadow: 
    0 6px 16px rgba(255, 85, 0, 0.3),
    inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.level-label {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: rgba(255, 255, 255, 0.65);
}

.level-value {
  font-size: 22px;
  font-weight: 900;
  color: #FF5500;
  line-height: 1;
  text-shadow: 0 0 16px rgba(255, 85, 0, 0.7);
}

.elo-diff {
  text-align: center;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 18px;
  min-height: 22px;
}

.winloss-section {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 12px;
  padding: 18px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

.winloss-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: rgba(255, 255, 255, 0.55);
  margin-bottom: 12px;
  text-align: center;
}

.winloss-display {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 14px;
}

.win-stat, .loss-stat {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.stat-number {
  font-size: 28px;
  font-weight: 900;
}

.stat-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  opacity: 0.8;
}

.separator {
  color: rgba(255, 255, 255, 0.35);
  font-size: 22px;
  font-weight: 300;
}

.winrate-bar {
  width: 100%;
  height: 5px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 5px;
  overflow: hidden;
  margin-top: 12px;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
}

.winrate-fill {
  height: 100%;
  background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
  border-radius: 5px;
  box-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
  transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.winrate-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
  animation: barShine 2.5s ease-in-out infinite;
}

@keyframes barShine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.winrate-percent {
  text-align: center;
  font-size: 12px;
  font-weight: 800;
  color: #4ade80;
  margin-top: 10px;
  text-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
}

.green { 
  color: #4ade80;
  text-shadow: 0 0 16px rgba(74, 222, 128, 0.8);
}

.red { 
  color: #f87171;
  text-shadow: 0 0 16px rgba(248, 113, 113, 0.8);
}

#glow {
  position: absolute;
  right: 40px;
  bottom: 40px;
  width: 480px;
  height: 480px;
  border-radius: 30px;
  background: radial-gradient(circle, rgba(255, 85, 0, 0.5) 0%, rgba(168, 85, 247, 0.4) 50%, rgba(0, 240, 255, 0.3) 100%);
  filter: blur(50px);
  opacity: 0;
  animation: glowPulse 6s ease-in-out infinite;
  pointer-events: none;
}

@keyframes glowPulse {
  0%, 100% { 
    opacity: 0.25;
    transform: scale(0.94) rotate(0deg);
  }
  50% { 
    opacity: 0.5;
    transform: scale(1.08) rotate(12deg);
  }
}

.elo-pulse {
  animation: eloPulse 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes eloPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.18); }
}

.win-bounce {
  animation: winBounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes winBounce {
  0%, 100% { transform: scale(1); }
  50% { 
    transform: scale(1.4);
    filter: drop-shadow(0 0 24px #4ade80);
  }
}

.loss-bounce {
  animation: lossBounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes lossBounce {
  0%, 100% { transform: scale(1); }
  50% { 
    transform: scale(1.4);
    filter: drop-shadow(0 0 24px #f87171);
  }
}

.elo-gain {
  animation: eloGain 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes eloGain {
  0% { transform: translateY(30px) scale(0.7); opacity: 0; }
  60% { transform: translateY(-8px) scale(1.12); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

.elo-loss {
  animation: eloLoss 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes eloLoss {
  0% { transform: translateY(-30px) scale(0.7); opacity: 0; }
  60% { transform: translateY(8px) scale(1.12); }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

#screenFlash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 9999;
}

.flash-win {
  animation: flashWin 0.7s ease-out;
}

@keyframes flashWin {
  0% { background: rgba(74, 222, 128, 0.4); opacity: 1; }
  100% { background: transparent; opacity: 0; }
}

.flash-loss {
  animation: flashLoss 0.7s ease-out;
}

@keyframes flashLoss {
  0% { background: rgba(248, 113, 113, 0.4); opacity: 1; }
  100% { background: transparent; opacity: 0; }
}
</style>
</head>
<body>

<div id="hud">
  <div class="accent-bar"></div>
  
  <div class="hud-header">
    <div class="faceit-icon">F</div>
    <div class="header-text">
      <div id="title">FACEIT</div>
      <div class="subtitle">Counter-Strike 2</div>
    </div>
  </div>
  
  <div class="hud-body">
    <div class="elo-section">
      <div class="elo-info">
        <span class="elo-label">ELO</span>
        <span class="elo-value" id="elo">----</span>
      </div>
      <div class="level-badge">
        <span class="level-label">LVL</span>
        <span class="level-value" id="lvl">-</span>
      </div>
    </div>
    
    <div class="elo-diff" id="eloDiff"></div>
    
    <div class="winloss-section">
      <div class="winloss-label">Match Record</div>
      <div class="winloss-display">
        <div class="win-stat">
          <span class="stat-number green" id="wins">-</span>
          <span class="stat-label green">W</span>
        </div>
        <span class="separator">/</span>
        <div class="loss-stat">
          <span class="stat-number red" id="losses">-</span>
          <span class="stat-label red">L</span>
        </div>
      </div>
      <div class="winrate-bar">
        <div class="winrate-fill" id="winrateFill"></div>
      </div>
      <div class="winrate-percent" id="winratePercent">-%</div>
    </div>
  </div>
</div>

<div id="glow"></div>
<div id="screenFlash"></div>

<script>
const API_URL = "https://api.jakobkristensen.com/76561198252968768";

const elements = {
  lvl: document.getElementById("lvl"),
  elo: document.getElementById("elo"),
  wins: document.getElementById("wins"),
  losses: document.getElementById("losses"),
  eloDiff: document.getElementById("eloDiff"),
  winrateFill: document.getElementById("winrateFill"),
  winratePercent: document.getElementById("winratePercent"),
  screenFlash: document.getElementById("screenFlash")
};

let previousData = {
  elo: null,
  wins: null,
  losses: null
};

function triggerScreenFlash(isWin) {
  elements.screenFlash.className = isWin ? 'flash-win' : 'flash-loss';
  setTimeout(() => elements.screenFlash.className = '', 700);
}

function animateEloChange(isGain) {
  elements.elo.classList.add(isGain ? 'elo-gain' : 'elo-loss');
  setTimeout(() => elements.elo.classList.remove('elo-gain', 'elo-loss'), 900);
}

function animateWinLoss(type) {
  const element = type === 'win' ? elements.wins.parentElement : elements.losses.parentElement;
  element.classList.add(type === 'win' ? 'win-bounce' : 'loss-bounce');
  setTimeout(() => element.classList.remove('win-bounce', 'loss-bounce'), 700);
}

async function updateFaceit() {
  try {
    const res = await fetch(API_URL);
    const d = await res.json();
    
    const eloChanged = previousData.elo !== null && previousData.elo !== d.elo;
    const winChanged = previousData.wins !== null && previousData.wins !== d.results.wins;
    const lossChanged = previousData.losses !== null && previousData.losses !== d.results.losses;
    
    if (eloChanged) {
      const isGain = d.elo > previousData.elo;
      animateEloChange(isGain);
      elements.elo.classList.add('elo-pulse');
      setTimeout(() => elements.elo.classList.remove('elo-pulse'), 700);
    }
    
    if (winChanged && d.results.wins > previousData.wins) {
      triggerScreenFlash(true);
      animateWinLoss('win');
    }
    
    if (lossChanged && d.results.losses > previousData.losses) {
      triggerScreenFlash(false);
      animateWinLoss('loss');
    }
    
    elements.lvl.textContent = d.lvl;
    elements.elo.textContent = d.elo;
    elements.wins.textContent = d.results.wins;
    elements.losses.textContent = d.results.losses;
    
    const totalGames = d.results.wins + d.results.losses;
    const winrate = totalGames > 0 ? (d.results.wins / totalGames * 100) : 0;
    elements.winrateFill.style.width = winrate + '%';
    elements.winratePercent.textContent = winrate.toFixed(0) + '%';
    
    const diff = d.todayEloDiff;
    if (diff && diff.startsWith("+")) {
      elements.eloDiff.innerHTML = `<span class="green">▲ ${diff} today</span>`;
    } else if (diff && diff.startsWith("-")) {
      elements.eloDiff.innerHTML = `<span class="red">▼ ${diff} today</span>`;
    } else {
      elements.eloDiff.innerHTML = `<span style="color: rgba(255,255,255,0.35); font-size: 12px;">—</span>`;
    }
    
    previousData = {
      elo: d.elo,
      wins: d.results.wins,
      losses: d.results.losses
    };
    
  } catch (e) {
    console.error('FACEIT API Error:', e);
  }
}

updateFaceit();
setInterval(updateFaceit, 3000);
</script>

</body>
</html>
