<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FACEIT Overlay</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 1920px;
  height: 1080px;
  background: transparent !important;
  overflow: hidden;
}

body {
  font-family: 'Segoe UI', 'Arial', sans-serif;
  color: #fff;
}

#hud {
  position: absolute;
  top: 30px;
  left: 30px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 280px;
}

.card {
  background: linear-gradient(135deg, rgba(20, 22, 28, 0.95) 0%, rgba(15, 17, 22, 0.92) 100%);
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 
    0 8px 32px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--accent-color) 0%, transparent 100%);
  opacity: 0.8;
}

/* ELO Card */
.card-elo {
  --accent-color: #FF5500;
}

.card-elo::after {
  content: '';
  position: absolute;
  right: -30px;
  top: 50%;
  transform: translateY(-50%);
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, rgba(255, 85, 0, 0.15) 0%, transparent 70%);
  pointer-events: none;
}

/* Level Card */
.card-level {
  --accent-color: #FF5500;
}

.card-level::after {
  content: '';
  position: absolute;
  right: -30px;
  top: 50%;
  transform: translateY(-50%);
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, rgba(255, 85, 0, 0.12) 0%, transparent 70%);
  pointer-events: none;
}

/* Winrate Card */
.card-winrate {
  --accent-color: #4ade80;
}

.card-winrate::after {
  content: '';
  position: absolute;
  right: -30px;
  top: 50%;
  transform: translateY(-50%);
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, rgba(74, 222, 128, 0.1) 0%, transparent 70%);
  pointer-events: none;
}

/* Icon styles */
.card-icon {
  width: 50px;
  height: 50px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 22px;
  box-shadow: 
    0 6px 20px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  flex-shrink: 0;
}

.icon-elo {
  background: linear-gradient(135deg, #FF5500 0%, #FF7733 100%);
}

.icon-level {
  background: linear-gradient(135deg, #FF5500 0%, #FF7733 100%);
  border: 3px solid rgba(255, 85, 0, 0.4);
}

.icon-winrate {
  background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
  font-size: 18px;
}

/* Card content */
.card-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
  z-index: 1;
}

.card-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: rgba(255, 255, 255, 0.5);
}

.card-value {
  font-size: 28px;
  font-weight: 900;
  color: #fff;
  line-height: 1;
  letter-spacing: -1px;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.card-value-small {
  font-size: 24px;
}

.value-trend {
  font-size: 14px;
  font-weight: 800;
}

.trend-up {
  color: #4ade80;
  text-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
}

.trend-down {
  color: #f87171;
  text-shadow: 0 0 12px rgba(248, 113, 113, 0.6);
}

/* Win/Loss display */
.wl-display {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 22px;
  font-weight: 900;
}

.wl-separator {
  color: rgba(255, 255, 255, 0.3);
  font-weight: 400;
  font-size: 18px;
}

.wl-wins {
  color: #4ade80;
  text-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
}

.wl-losses {
  color: #f87171;
  text-shadow: 0 0 12px rgba(248, 113, 113, 0.6);
}

/* Progress bar */
.progress-bar {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 4px;
  overflow: hidden;
  margin-top: 6px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
  border-radius: 4px;
  box-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
  transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}

/* === CSAK EVENT ANIMÁCIÓK === */

/* Érték pulse amikor változik */
.value-pulse {
  animation: valuePulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes valuePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* Card flash win-nél */
.card-flash-win {
  animation: cardFlashWin 0.6s ease;
}

@keyframes cardFlashWin {
  0%, 100% { 
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }
  50% { 
    border-color: rgba(74, 222, 128, 0.6);
    box-shadow: 0 8px 32px rgba(74, 222, 128, 0.4);
  }
}

/* Card flash loss-nál */
.card-flash-loss {
  animation: cardFlashLoss 0.6s ease;
}

@keyframes cardFlashLoss {
  0%, 100% { 
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }
  50% { 
    border-color: rgba(248, 113, 113, 0.6);
    box-shadow: 0 8px 32px rgba(248, 113, 113, 0.4);
  }
}

/* Screen flash */
#screenFlash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  z-index: 9999;
}

.flash-win {
  animation: flashWin 0.7s ease-out;
}

@keyframes flashWin {
  0% { background: rgba(74, 222, 128, 0.4); opacity: 1; }
  100% { background: transparent; opacity: 0; }
}

.flash-loss {
  animation: flashLoss 0.7s ease-out;
}

@keyframes flashLoss {
  0% { background: rgba(248, 113, 113, 0.4); opacity: 1; }
  100% { background: transparent; opacity: 0; }
}
</style>
</head>
<body>

<div id="hud">
  <!-- ELO Card -->
  <div class="card card-elo">
    <div class="card-icon icon-elo">F</div>
    <div class="card-content">
      <div class="card-label">FACEIT ELO</div>
      <div class="card-value">
        <span id="elo">----</span>
        <span class="value-trend" id="eloDiff"></span>
      </div>
    </div>
  </div>

  <!-- Level Card -->
  <div class="card card-level">
    <div class="card-icon icon-level" id="levelIcon">-</div>
    <div class="card-content">
      <div class="card-label">LEVEL</div>
      <div class="card-value card-value-small">
        <span>Level <span id="lvl">-</span></span>
      </div>
    </div>
  </div>

  <!-- Win/Loss Card -->
  <div class="card card-winrate">
    <div class="card-icon icon-winrate">
      <span id="winratePercent">-%</span>
    </div>
    <div class="card-content">
      <div class="card-label">MATCH RECORD</div>
      <div class="wl-display">
        <span class="wl-wins" id="wins">-</span>
        <span class="wl-separator">/</span>
        <span class="wl-losses" id="losses">-</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="winrateFill"></div>
      </div>
    </div>
  </div>
</div>

<div id="screenFlash"></div>

<script>
const API_URL = "https://api.jakobkristensen.com/76561198252968768";

const elements = {
  lvl: document.getElementById("lvl"),
  levelIcon: document.getElementById("levelIcon"),
  elo: document.getElementById("elo"),
  wins: document.getElementById("wins"),
  losses: document.getElementById("losses"),
  eloDiff: document.getElementById("eloDiff"),
  winrateFill: document.getElementById("winrateFill"),
  winratePercent: document.getElementById("winratePercent"),
  screenFlash: document.getElementById("screenFlash"),
  cardElo: document.querySelector('.card-elo'),
  cardLevel: document.querySelector('.card-level'),
  cardWinrate: document.querySelector('.card-winrate')
};

let previousData = {
  elo: null,
  wins: null,
  losses: null
};

function triggerScreenFlash(isWin) {
  elements.screenFlash.className = isWin ? 'flash-win' : 'flash-loss';
  setTimeout(() => elements.screenFlash.className = '', 700);
}

function animateCard(card, isWin) {
  card.classList.add(isWin ? 'card-flash-win' : 'card-flash-loss');
  setTimeout(() => {
    card.classList.remove('card-flash-win', 'card-flash-loss');
  }, 600);
}

function pulseValue(element) {
  element.classList.add('value-pulse');
  setTimeout(() => element.classList.remove('value-pulse'), 600);
}

async function updateFaceit() {
  try {
    const res = await fetch(API_URL);
    const d = await res.json();
    
    const eloChanged = previousData.elo !== null && previousData.elo !== d.elo;
    const winChanged = previousData.wins !== null && previousData.wins !== d.results.wins;
    const lossChanged = previousData.losses !== null && previousData.losses !== d.results.losses;
    
    // ELO változás
    if (eloChanged) {
      const isGain = d.elo > previousData.elo;
      pulseValue(elements.elo);
      animateCard(elements.cardElo, isGain);
    }
    
    // Win változás
    if (winChanged && d.results.wins > previousData.wins) {
      triggerScreenFlash(true);
      pulseValue(elements.wins);
      animateCard(elements.cardWinrate, true);
    }
    
    // Loss változás
    if (lossChanged && d.results.losses > previousData.losses) {
      triggerScreenFlash(false);
      pulseValue(elements.losses);
      animateCard(elements.cardWinrate, false);
    }
    
    // Adatok frissítése
    elements.lvl.textContent = d.lvl;
    elements.levelIcon.textContent = d.lvl;
    elements.elo.textContent = d.elo;
    elements.wins.textContent = d.results.wins;
    elements.losses.textContent = d.results.losses;
    
    // Winrate
    const totalGames = d.results.wins + d.results.losses;
    const winrate = totalGames > 0 ? (d.results.wins / totalGames * 100) : 0;
    elements.winrateFill.style.width = winrate + '%';
    elements.winratePercent.textContent = winrate.toFixed(0) + '%';
    
    // ELO diff
    const diff = d.todayEloDiff;
    if (diff && diff.startsWith("+")) {
      elements.eloDiff.innerHTML = `<span class="trend-up">▲${diff}</span>`;
    } else if (diff && diff.startsWith("-")) {
      elements.eloDiff.innerHTML = `<span class="trend-down">▼${diff}</span>`;
    } else {
      elements.eloDiff.innerHTML = '';
    }
    
    previousData = {
      elo: d.elo,
      wins: d.results.wins,
      losses: d.results.losses
    };
    
  } catch (e) {
    console.error('FACEIT API Error:', e);
  }
}

updateFaceit();
setInterval(updateFaceit, 3000);
</script>

</body>
</html>
